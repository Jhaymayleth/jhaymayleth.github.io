<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portafolio de José Mauricio Rangel Núñez, desarrollador Full Stack. Interfaces que se sienten, sistemas que sostienen."
    />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('portfolio:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0e100f' : '#f7f5f0')
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/hiro-misake/HIROMISAKE.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>José Mauricio Rangel Núñez — Desarrollador Full Stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
